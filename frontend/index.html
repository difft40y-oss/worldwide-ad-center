Worldwide Ad Center Engine
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldwide Ad Center - Admin Panel</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        h1, h3 { margin: 0 0 10px 0; color: #38bdf8; }
        button { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <h1>Worldwide Ad Center Dashboard</h1>
    <p>Operational Zone: Gandaki Province, Nepal</p>
    <div class="grid">
        <div class="card">
            <h3>Ad Engine Performance</h3>
            <p>Status: <span style="color: #4ade80;">Active</span></p>
            <button onclick="alert('Fetching Live Ad Impression Matrices...')">View Analytics</button>
        </div>
        <div class="card">
            <h3>Publisher Network</h3>
            <p>Verification Gateway: Online</p>
            <button onclick="alert('Opening Publisher Registries...')">Manage Publishers</button>
        </div>
        <div class="card">
            <h3>Financial Clearance</h3>
            <p>Settlement Channel: eSewa Bridge</p>
            <button onclick="alert('Minimum Threshold: Rs 500.00')">Process Payouts</button>
        </div>
    </div>
</body>
</html>
